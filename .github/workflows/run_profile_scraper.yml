name: Run Institute Scraper

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      batch_num:
        description: 'Batch number to run manually (overrides matrix)'
        required: false
        default: ''
  schedule:
    - cron: "0 6 * * *"   # Runs daily at 6:00 UTC

permissions:
  contents: write

jobs:
  run-batches:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          BATCH_OVERRIDE: ${{ github.event.inputs.batch_num }}
        run: |
          BATCH_NUM=${BATCH_OVERRIDE:-${{ matrix.batch }}}
          echo "Running batch number: $BATCH_NUM"
          python web-scraper/scripts/profile_scraper.py $BATCH_NUM

      - name: List generated database files
        run: |
          echo "Databases generated:"
          ls -lh databases/*.db || echo "No databases found."

      - name: Commit and push all updated DBs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update IRINS databases (auto)"
          file_pattern: "databases/*.db"
          branch: main
