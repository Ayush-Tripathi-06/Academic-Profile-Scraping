name: Run Institute Geocoder - IIMs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run_institute_geocoder_iims.yml"  # only triggers when this file changes
  workflow_dispatch:
    inputs:
      org_type:
        description: 'Organization type to run (e.g., IIMs)'
        required: true
        default: 'IIMs'

permissions:
  contents: write

jobs:
  run-geocoder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run OpenCage geocoder
        env:
          OPENCAGE_KEYS: ${{ secrets.OPENCAGE_KEYS }}
        run: |
          ORG_TYPE="${{ github.event.inputs.org_type }}"
          if [ -z "$ORG_TYPE" ]; then
            ORG_TYPE="IIMs"
          fi
          echo "Running geocoder for organization type: $ORG_TYPE"
          python web-scraper/scripts/update_geolocation.py --org-type "$ORG_TYPE"

      - name: List updated database files
        run: |
          echo "Databases updated:"
          ls -lh databases/*_profiles.db || echo "No profile DBs found."

      - name: Commit and push updated DBs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update Institute profiles databases (auto)"
          file_pattern: "databases/*_profiles.db"
          branch: main
          push_options: "--force"
