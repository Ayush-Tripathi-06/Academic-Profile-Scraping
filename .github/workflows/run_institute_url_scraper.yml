name: Run Institute Scraper

permissions:
  contents: write
#trigger workflow manually
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        run: |
          python web-scraper/scripts/institute_url_scraper.py

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: irins-database
          path: databases/irins_institute_urls.db

      - name: Push database to repo
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: true
          directory: databases
