name: Run Institute Geocoder

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      org_type:
        description: 'Select organization type to run'
        required: true
        default: 'IITs & IISc'
        type: choice
        options:
          - 'IITs & IISc'
  schedule:
    - cron: "0 6 * * *"   # Runs daily at 6:00 UTC

permissions:
  contents: write

jobs:
  run-geocoder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run OpenCage geocoder
        env:
          OPENCAGE_KEYS: ${{ secrets.OPENCAGE_KEYS }}
        run: |
          echo "Running geocoder for organization type: ${{ github.event.inputs.org_type }}"
          python your_script_path/opencage_updater.py --org-type "${{ github.event.inputs.org_type }}"

      - name: List updated database files
        run: |
          echo "Databases updated:"
          ls -lh databases/*_profiles.db || echo "No profile DBs found."

      - name: Commit and push updated DBs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update Institute profiles databases (auto)"
          file_pattern: "databases/*_profiles.db"
          branch: main
          push_options: "--force"
